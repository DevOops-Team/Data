name: checkpoint

# main 필수 검사로 쓰므로 경로 필터 없이 모든 PR에서 실행 (경로 필터가 있으면 해당 경로를 건드리지 않는 PR이 검사 대기로 막힘)
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: checkpoint · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt "moto[server]>=5.0" "pytest>=8"
      - run: python -m pytest -q
      - name: 실제 AWS 스모크 스크립트를 moto로 검증
        run: RETRY_BACKOFF=0 python scripts/aws_smoke.py --moto --mb 2

  image:
    name: checkpoint · image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 이미지 빌드 (push는 이미지 저장소 GHCR/ECR 확정 후)
        uses: docker/build-push-action@v6
        with:
          context: checkpoint
          load: true
          push: false
          tags: devoops/ckpt:ci
      - name: 진입점 확인 (init · sidecar 모듈 로드, 비루트 실행)
        run: |
          docker run --rm devoops/ckpt:ci python -c "import ckpt.init_main, ckpt.sidecar, ckpt.retry, ckpt.events, confluent_kafka; print('ok')"
          docker run --rm devoops/ckpt:ci id -u | grep -qx 1000
          docker run --rm -e JOB_ID=x devoops/ckpt:ci python -m ckpt.init_main 2>&1 | grep -q "GENERATION"
